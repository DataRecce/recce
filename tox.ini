[tox]
envlist = dbt1.6, dbt1.7, dbt1.8, dbt1.9, dbtlatest
requires = tox-uv

# Every test env installs from uv.lock (`uv sync`) so CI tests the versions the
# lock pins, not whatever is newest inside the pyproject ranges. Resolving fresh
# let sqlglot 30.25+ break column-level lineage unnoticed (DRC-5072).
# With uv-venv-lock-runner, `deps` is ignored: test tools come from the `dev` extra.

[testenv:dbt{1.6,1.7,1.8,1.9,latest}]
runner = uv-venv-lock-runner
basepython = python3.10
# only test mcp for the latest dbt version, and through the extra so the env
# inherits the window pyproject declares instead of drifting from it.
extras =
    dev
    dbtlatest: mcp
# The dbt matrix deliberately varies dbt itself, so after the locked sync:
#   1. swap in the pinned dbt-duckdb (this can drag shared deps backwards,
#      e.g. dbt 1.6 -> dbt-semantic-interfaces 0.2 -> pydantic 1.10), then
#   2. reinstall recce's own dependencies constrained to uv.lock, putting
#      everything recce imports back on its locked version (pydantic 2.x).
# dbt's private dependencies stay wherever step 1 put them. This is the same
# two-step order the pre-lock tox used (deps first, then package deps).
allowlist_externals = uv
commands_pre =
    dbt1.6: uv pip install --python {envpython} "dbt-duckdb==1.6.*"
    dbt1.7: uv pip install --python {envpython} "dbt-duckdb==1.7.*"
    dbt1.8: uv pip install --python {envpython} "dbt-duckdb==1.8.*"
    dbt1.9: uv pip install --python {envpython} "dbt-duckdb==1.9.*"
    dbt1.{6,7,8,9}: uv export --frozen --no-hashes --no-emit-project --format requirements-txt --output-file {envtmpdir}/uv-lock-constraints.txt
    dbt1.{6,7,8,9}: uv pip install --python {envpython} -r pyproject.toml --constraint {envtmpdir}/uv-lock-constraints.txt
commands =
    pytest --cov --cov-append --cov-report=xml {posargs:./tests}

[testenv:{3.10,3.11,3.12,3.13}]
runner = uv-venv-lock-runner
extras =
    dev
commands =
    pytest {posargs:./tests}

[testenv:clean]
deps = coverage
skip_install = true
commands = coverage erase
