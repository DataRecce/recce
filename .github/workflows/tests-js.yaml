name: Test JS

on:
  push:
    branches:
      - main
    paths:
      - "js/**"
  pull_request:
    branches:
      - main
    paths:
      - "js/**"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 26
        uses: actions/setup-node@v7
        with:
          node-version-file: 'js/.nvmrc'

      - name: Set up pnpm
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          package-json-file: js/package.json
          install: false
          cache: true
          cache-dependency-path: js/pnpm-lock.yaml

      - name: Verify pnpm version
        working-directory: ./js
        run: |
          expected=$(node -p "require('./package.json').packageManager.match(/^pnpm@([^+]+)/)[1]")
          actual=$(pnpm --version)
          echo "pnpm version: $actual"
          test "$actual" = "$expected"

      - name: Install dependencies
        working-directory: ./js
        run: pnpm install --frozen-lockfile

      - name: Run Biome linter
        working-directory: ./js
        run: pnpm lint

  test-and-build:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 26
        uses: actions/setup-node@v7
        with:
          node-version-file: 'js/.nvmrc'

      - name: Set up pnpm
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          package-json-file: js/package.json
          install: false
          cache: true
          cache-dependency-path: js/pnpm-lock.yaml

      - name: Verify pnpm version
        working-directory: ./js
        run: |
          expected=$(node -p "require('./package.json').packageManager.match(/^pnpm@([^+]+)/)[1]")
          actual=$(pnpm --version)
          echo "pnpm version: $actual"
          test "$actual" = "$expected"

      - name: Install dependencies
        working-directory: ./js
        run: pnpm install --frozen-lockfile

      - name: Run Jest Tests
        working-directory: ./js
        run: pnpm test

      - name: Build the static files
        working-directory: ./js
        run: pnpm build
