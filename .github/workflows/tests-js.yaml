name: Test JS

on:
  push:
    branches:
      - main
    paths:
      - "js/**"
  pull_request:
    branches:
      - main
    paths:
      - "js/**"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js 26
        uses: actions/setup-node@v7
        with:
          node-version-file: 'js/.nvmrc'

      - name: Set up pnpm
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          working-directory: js
          node-version-file: false
          install: false
          cache: true
          cache-dependency-path: js/pnpm-lock.yaml

      - name: Verify pnpm version
        working-directory: ./js
        run: |
          expected=$(node -p "require('./package.json').packageManager.match(/^pnpm@([^+]+)/)[1]")
          actual=$(pnpm --version)
          echo "pnpm version: $actual"
          test "$actual" = "$expected"

      - name: Install dependencies
        working-directory: ./js
        run: pnpm install --frozen-lockfile

      - name: Run Biome linter
        working-directory: ./js
        run: pnpm lint

  test-and-build:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js 26
        uses: actions/setup-node@v7
        with:
          node-version-file: 'js/.nvmrc'

      - name: Set up pnpm
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          working-directory: js
          node-version-file: false
          install: false
          cache: true
          cache-dependency-path: js/pnpm-lock.yaml

      - name: Verify pnpm version
        working-directory: ./js
        run: |
          expected=$(node -p "require('./package.json').packageManager.match(/^pnpm@([^+]+)/)[1]")
          actual=$(pnpm --version)
          echo "pnpm version: $actual"
          test "$actual" = "$expected"

      - name: Install dependencies
        working-directory: ./js
        run: pnpm install --frozen-lockfile

      - name: Run Jest Tests
        working-directory: ./js
        run: pnpm test

      - name: Build and smoke the UI package
        working-directory: ./js
        run: |
          pnpm --filter @datarecce/ui build
          pnpm test:dist

      - name: Build the static files
        working-directory: ./js
        run: pnpm build
